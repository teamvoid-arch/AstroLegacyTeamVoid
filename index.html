      <h1>Astro Legacy</h1>
      <p>Astro Legacy is an interactive 3D story for school-age space fans about NASA hardware left on the Moon, on Mars and in deep space:
        Ranger 7, Surveyor 1 and 3, Apollo 11's Eagle and its laser mirror, the Apollo 15 rover, Apollo 17, the Lunar Reconnaissance Orbiter,
        Viking 1, Sojourner, Opportunity, Curiosity, InSight, Perseverance's parachute, Ingenuity, the Three Forks sample depot, Pioneer 10,
        Voyager 1 and 2, and New Horizons, plus 36 side trips. Every fact links to a NASA source. Please enable JavaScript to play it.
        See README.md, JUDGES.md, DATA.md and SOURCES.md in the project repository.</p>
